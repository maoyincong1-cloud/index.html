<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>日本生活管理ダッシュボード</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h2 { border-left: 5px solid #1a73e8; padding-left: 10px; color: #333; }
        .input-group { display: flex; gap: 5px; margin-bottom: 20px; }
        input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 10px 15px; background: #1a73e8; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .list-item { padding: 10px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
    </style>
</head>
<body>
    <div class="container">
        <h2>📊 日本生活管理</h2>
        
        <div class="input-group">
            <input type="text" id="input" placeholder="タスクや出費を入力...">
            <button onclick="addItem()">追加</button>
        </div>
        
        <div id="displayArea"></div>
        <p>合計項目数: <span id="total">0</span></p>
    </div>

    <script>
        let data = JSON.parse(localStorage.getItem('lifeData')) || [];

        function render() {
            const list = document.getElementById('displayArea');
            list.innerHTML = "";
            data.forEach((item, index) => {
                list.innerHTML += `<div class="list-item">${item} <button onclick="del(${index})">×</button></div>`;
            });
            document.getElementById('total').innerText = data.length;
            localStorage.setItem('lifeData', JSON.stringify(data));
        }

        function addItem() {
            const val = document.getElementById('input').value;
            if(!val) return;
            data.push(val);
            document.getElementById('input').value = "";
            render();
        }

        function del(i) {
            data.splice(i, 1);
            render();
        }

        render(); // 初始化渲染
    </script>
</body>
</html>
