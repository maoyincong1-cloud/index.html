<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>日本生活 救急マップ</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f9f9f9; padding: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; max-width: 400px; margin: 20px auto; }
        button { padding: 20px; font-size: 16px; cursor: pointer; border: none; border-radius: 10px; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        button:hover { background: #e0e0e0; }
        h1 { color: #333; }
    </style>
</head>
<body>
    <h1>日本生活：近隣施設検索</h1>
    <p>今すぐ必要な場所をタップしてください</p>
    
    <div class="grid">
        <button onclick="window.open('https://www.google.com/maps/search/コンビニ')">🏪 コンビニ</button>
        <button onclick="window.open('https://www.google.com/maps/search/郵便局')">📮 郵便局</button>
        <button onclick="window.open('https://www.google.com/maps/search/病院')">🏥 近隣の病院</button>
        <button onclick="window.open('https://www.google.com/maps/search/役所')">🏛️ 市役所</button>
    </div>
</body>
</html>
