<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>日本生活ゴミ分別アシスト</title>
    <style>
        body { font-family: "Helvetica Neue", Arial, sans-serif; background-color: #f0f4f8; padding: 20px; display: flex; justify-content: center; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); width: 320px; }
        h2 { color: #333; text-align: center; }
        input { width: 100%; padding: 12px; margin: 15px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; }
        button { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background: #218838; }
        #result { margin-top: 20px; padding: 15px; border-radius: 5px; background: #e8f5e9; color: #2e7d32; border-left: 5px solid #28a745; min-height: 50px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>ゴミ分別検索</h2>
        <input type="text" id="trashInput" placeholder="例：新聞紙、瓶、生ゴミ">
        <button onclick="checkTrash()">検索</button>
        <div id="result">ここに分類結果が表示されます</div>
    </div>
    <script>
        const data = {
            "新聞紙": "資源ごみ",
            "雑誌": "資源ごみ",
            "瓶": "資源ごみ",
            "ペットボトル": "資源ごみ",
            "生ゴミ": "燃えるごみ",
            "ティッシュ": "燃えるごみ",
            "紙おむつ": "燃えるごみ",
            "乾電池": "有害ごみ",
            "傘": "燃えないごみ",
            "フライパン": "燃えないごみ"
        };
        function checkTrash() {
            let input = document.getElementById("trashInput").value;
            let res = data[input] || "該当なし。各自治体のルールを確認してください。";
            document.getElementById("result").innerText = input + " は : " + res;
        }
    </script>
</body>
</html>
