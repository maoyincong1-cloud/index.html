<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Command Center</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; }
        .widget-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; }
        .alert-bar { background: #ef4444; padding: 10px; border-radius: 8px; margin-bottom: 20px; font-weight: bold; }
        .btn-action { display: block; width: 100%; padding: 12px; margin-top: 8px; border-radius: 6px; border: none; background: #3b82f6; color: white; cursor: pointer; }
    </style>
</head>
<body>
    <div class="alert-bar" id="alert-zone">System: Detecting regional conditions...</div>
    
    <div class="widget-grid">
        <div class="card">
            <h3>🤖 AI 生活向导</h3>
            <p id="ai-suggestion">Loading context...</p>
            <button class="btn-action" onclick="fetchAIInsight()">刷新决策建议</button>
        </div>
        
        <div class="card">
            <h3>📍 快速撤离/搜索</h3>
            <button class="btn-action" onclick="window.open('https://www.google.com/maps/search/郵便局2')">搜索附近医院 (ER)</button>
            <button class="btn-action" onclick="window.open('https://www.google.com/maps/search/郵便局3')">查看电车运行状态</button>
        </div>
    </div>

    <script>
        // 模拟逻辑：根据时间/地理位置动态判断
        function fetchAIInsight() {
            const time = new Date().getHours();
            const el = document.getElementById('ai-suggestion');
            const alertEl = document.getElementById('alert-zone');
            
            // 复杂的逻辑判断模拟
            if(time > 22) {
                alertEl.innerText = "🚨 安全提醒: 夜间时段，请检查门窗并确保手机电量充足。";
                el.innerText = "建议: 此时段电车频率降低，若有出行计划请务必检查 Google Maps 的实时路线。";
            } else {
                alertEl.innerText = "✅ 系统正常: 当前环境信息无异常。";
                el.innerText = "建议: 利用午间时段处理役所业务或办理邮政事务。";
            }
        }
        fetchAIInsight();
    </script>
</body>
</html>
