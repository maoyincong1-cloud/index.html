<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Japan Life Command Center</title>
    <style>
        :root { --primary: #2563eb; }
        body { font-family: sans-serif; background: #f8fafc; padding: 20px; }
        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 800px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .btn-map { background: var(--primary); color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; width: 100%; }
        #ai-console { background: #1e293b; color: #38bdf8; padding: 15px; border-radius: 8px; font-family: monospace; }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="card">
            <h3>📍 地理中枢</h3>
            <button class="btn-map" onclick="navigate('医院')">搜索附近医院</button>
            <button class="btn-map" onclick="navigate('避难所')">搜索附近避难所</button>
        </div>

        <div class="card">
            <h3>🤖 AI 决策建议</h3>
            <div id="ai-console">Waiting for location signal...</div>
            <button onclick="getAIDecision()" style="margin-top: 10px;">执行 AI 分析</button>
        </div>
    </div>

    <script>
        function navigate(type) {
            // 利用 Google Maps 深度集成能力
            window.open(`https://www.google.com/maps/search/${encodeURIComponent(type)}`);
        }

        async function getAIDecision() {
            const consoleEl = document.getElementById('ai-console');
            consoleEl.innerText = "Analyzing environment...";
            // 模拟 AI 决策逻辑：根据地理位置/时间给出建议
            setTimeout(() => {
                const hour = new Date().getHours();
                const advice = hour < 18 ? "当前处于日间，建议避开通勤高峰，前往附近超市采购。" : "夜间光线较暗，请优先选择大路通行。";
                consoleEl.innerText = `> ${advice}`;
            }, 1000);
        }
    </script>
</body>
</html>
