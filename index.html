<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>SNSプランニング支援ツール</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; padding: 20px; display: flex; justify-content: center; }
        .app-box { background: white; padding: 25px; border-radius: 12px; width: 350px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        select, button { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #ccc; }
        button { background: #ff4757; color: white; border: none; font-weight: bold; cursor: pointer; }
        #output { margin-top: 20px; padding: 15px; background: #fff3f3; border-left: 5px solid #ff4757; }
    </style>
</head>
<body>
    <div class="app-box">
        <h2>SNSコンテンツ企画支援</h2>
        <label>カテゴリーを選択:</label>
        <select id="category">
            <option value="日常">日常・Vlog</option>
            <option value="技術">プログラミング・学習</option>
            <option value="グルメ">グルメ・レビュー</option>
        </select>
        <button onclick="generateIdea()">アイデアを生成</button>
        <div id="output">ここに企画アイデアが表示されます</div>
    </div>
    <script>
        const ideas = {
            "日常": "今日のルーティンをタイムラプスで撮影してみよう！",
            "技術": "今日学んだエラー解決法をTipsとして共有しよう！",
            "グルメ": "おすすめのお店で一番感動したメニューを投稿しよう！"
        };
        function generateIdea() {
            let cat = document.getElementById("category").value;
            document.getElementById("output").innerText = "企画案: " + ideas[cat];
        }
    </script>
</body>
</html>
