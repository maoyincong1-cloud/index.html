<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>生活管理ダッシュボード</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; }
        .container { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #eee; transition: 0.3s; }
        .done { text-decoration: line-through; color: #888; }
        input { width: 70%; padding: 8px; }
        button { padding: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1>タスク管理</h1>
        <input type="text" id="task" placeholder="例：電気代を払う...">
        <button onclick="add()">追加</button>
        <div id="list"></div>
        <p>残りタスク: <span id="count">0</span></p>
    </div>

    <script>
        let tasks = [];
        function add() {
            let val = document.getElementById("task").value;
            if(!val) return;
            tasks.push({text: val, done: false});
            render();
            document.getElementById("task").value = "";
        }
        function toggle(i) {
            tasks[i].done = !tasks[i].done;
            render();
        }
        function render() {
            let list = document.getElementById("list");
            list.innerHTML = "";
            tasks.forEach((t, i) => {
                list.innerHTML += `<div class="item ${t.done ? 'done' : ''}" onclick="toggle(${i})">${t.text}</div>`;
            });
            document.getElementById("count").innerText = tasks.filter(t => !t.done).length;
        }
    </script>
</body>
</html>
