<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Smart Life Hub - Kawaguchi Edition</title>
    <style>
        :root { --primary: #3b82f6; }
        body { font-family: 'Segoe UI', system-ui; background: #0f172a; color: white; padding: 20px; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .card { background: #1e293b; padding: 20px; border-radius: 16px; border: 1px solid #334155; }
        .status-badge { padding: 4px 8px; border-radius: 4px; background: #ef4444; font-size: 12px; }
        button { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 10px; }
    </style>
</head>
<body>
    <header>
        <h1>Smart Life Command Center</h1>
        <p id="geo-status">System Initialized: Ready to monitor...</p>
    </header>

    <div class="grid-container">
        <div class="card">
            <h3>📍 Intelligent Location Engine</h3>
            <div id="facility-list"></div>
            <button onclick="updateLocation()">手动校准坐标系</button>
        </div>

        <div class="card">
            <h3>🧠 Logic & Context Engine</h3>
            <div id="ai-output">Analyzing current environment context...</div>
        </div>
    </div>

    <script>
        const facilities = ['病院', '市役所', 'スーパー', '交番'];
        
        // 核心工程逻辑：地理位置感知引擎
        function updateLocation() {
            navigator.geolocation.getCurrentPosition(pos => {
                const { latitude, longitude } = pos.coords;
                document.getElementById('geo-status').innerText = `Location Locked: ${latitude.toFixed(4)}, ${longitude.toFixed(4)}`;
                triggerAIScenario(latitude, longitude);
            });
        }

        function triggerAIScenario(lat, lon) {
            const time = new Date().getHours();
            const output = document.getElementById('ai-output');
            // 复杂逻辑判断
            if (time >= 22 || time <= 5) {
                output.innerHTML = "Night Mode Active: <br>Nearest 24h Convenience Store identified. Safety path enabled.";
            } else {
                output.innerHTML = "Day Mode Active: <br>Traffic density normal. Recommended facility path optimized.";
            }
        }

        // 初始化渲染
        const container = document.getElementById('facility-list');
        facilities.forEach(f => {
            container.innerHTML += `<button onclick="window.open('https://www.google.com/maps/search/${f}')">Search ${f}</button>`;
        });
    </script>
</body>
</html>
